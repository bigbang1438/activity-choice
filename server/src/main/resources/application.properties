server.address=127.0.0.1
server.port=8098
spring.datasource.url=jdbc:h2:file:${ACTIVITY_DATA_FILE:./data/activity-choice};WRITE_DELAY=0;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=8
spring.sql.init.mode=always
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.mapper.allow-coercion-of-scalars=false
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=32KB
